<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>设置 · 历史学习</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ctext y='13' font-size='13'%3E%E2%9A%99%EF%B8%8F%3C/text%3E%3C/svg%3E">
<style>
/* ════════════ 主题（全局统一：与其它页面共用同一套 4 主题，切换存于服务器 settings.json） ════════════ */
:root{
  --set-bg:#f5efe0; --set-text:#3a3228; --set-muted:#8a7f6c; --set-accent:#8a6d3b;
  --set-btn-bg:#fffdf6; --set-btn-tx:#8a6d3b; --set-card:#fffdf6; --set-input-bd:#d8cdb4;
}
body.theme-ocean{--set-bg:#ddeef7;--set-text:#1f3a4d;--set-muted:#76a0b8;--set-accent:#2b6cb0;--set-btn-bg:#f4fbfe;--set-btn-tx:#2b6cb0;--set-card:#f4fbfe;--set-input-bd:#bcd4e6;}
body.theme-forest{--set-bg:#e4f0e3;--set-text:#23402a;--set-muted:#7fa37c;--set-accent:#2f7d4f;--set-btn-bg:#f6fbf5;--set-btn-tx:#2f7d4f;--set-card:#f6fbf5;--set-input-bd:#bfd6c0;}
body.theme-mono{--set-bg:#fff;--set-text:#000;--set-muted:#444;--set-accent:#000;--set-btn-bg:#fff;--set-btn-tx:#000;--set-card:#fff;--set-input-bd:#aaa;}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{margin:0;background:var(--set-bg);color:var(--set-text);font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;padding-left:64px;transition:background .2s ease;}
.set-main{max-width:680px;margin:0 auto;padding:40px 24px;}
.set-main h1{font-size:24px;color:var(--set-accent);letter-spacing:1px;margin-bottom:6px;}
.set-ver{color:var(--set-muted);font-size:13px;margin-bottom:26px;}
.set-card{background:var(--set-card);border:1px solid var(--set-input-bd);border-radius:12px;padding:20px;margin-bottom:18px;}
.set-card h2{font-size:15px;color:var(--set-accent);margin-bottom:14px;border-bottom:1px dashed var(--set-input-bd);padding-bottom:8px;}
.set-row{margin-bottom:14px;}
.set-row label{display:block;font-size:13px;color:var(--set-muted);margin-bottom:5px;}
.set-row input[type=text],.set-row input[type=password]{width:100%;max-width:420px;padding:9px 11px;font-size:14px;color:var(--set-text);background:var(--set-btn-bg);border:1px solid var(--set-input-bd);border-radius:8px;}
.set-row input:focus{outline:none;border-color:var(--set-accent);}
.set-tip{font-size:12px;color:var(--set-muted);margin-top:5px;}
.set-btn{background:var(--set-accent);color:#fff;border:none;padding:10px 22px;border-radius:8px;font-size:14px;cursor:pointer;}
.set-btn:hover{filter:brightness(.92);}
.set-msg{display:none;margin-top:12px;padding:10px 12px;border-radius:8px;font-size:13px;}
.set-msg.ok{display:block;background:rgba(47,125,79,.12);color:#2f7d4f;border:1px solid rgba(47,125,79,.4);}
.set-msg.err{display:block;background:rgba(190,50,50,.1);color:#be3232;border:1px solid rgba(190,50,50,.4);}
.set-status{font-size:12px;}
.set-status .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:middle;}
.set-status .ok{background:#2f7d4f;}
.set-status .no{background:#be3232;}

/* 配色下拉（th- 前缀） */
#thBtn{position:fixed;top:16px;right:16px;z-index:300;font-size:13px;padding:7px 12px;border:1px solid var(--set-accent);border-radius:8px;background:var(--set-btn-bg);color:var(--set-accent);cursor:pointer;}
#thBtn:hover{filter:brightness(.95);}
.th-dropdown{display:none;position:fixed;top:56px;right:16px;min-width:250px;background:var(--set-btn-bg);
  border:1px solid var(--set-accent);border-radius:8px;padding:12px;box-shadow:0 8px 22px rgba(0,0,0,.16);z-index:300;}
.th-dropdown.open{display:block;}
.th-dropdown h4{margin:0 0 8px;font-size:13px;color:var(--set-muted);border-bottom:1px solid var(--set-accent);padding-bottom:6px;}
.th-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.th-item{border:2px solid var(--set-accent);border-radius:6px;padding:6px 8px;cursor:pointer;font-size:12px;display:flex;align-items:center;gap:6px;color:var(--set-text);background:var(--set-btn-bg);}
.th-item.active{border-color:var(--set-accent);outline:2px solid var(--set-accent);}
.th-swatch{width:26px;height:18px;border:1px solid #999;border-radius:3px;flex:none;}
</style>
<style>
/* ════════════ 侧边栏（类名统一 sb- 前缀） ════════════ */
:root{--sb-w:64px;--sb-w-open:220px;--sb-bg:#8a6d3b;}
body.theme-ocean{--sb-bg:#2b6cb0;}
body.theme-forest{--sb-bg:#2f7d4f;}
body.theme-mono{--sb-bg:#000;}
.sb-sidebar{position:fixed;top:0;left:0;bottom:0;width:var(--sb-w);background:var(--sb-bg);padding:16px 0;overflow:hidden;overflow-x:hidden;z-index:1000;box-shadow:1px 0 0 rgba(0,0,0,.06);user-select:none;-webkit-tap-highlight-color:transparent;transition:width .26s cubic-bezier(.4,0,.2,1);}
.sb-sidebar:hover,.sb-sidebar:focus-within{width:var(--sb-w-open);}
.sb-item{display:flex;align-items:center;height:56px;margin:2px 8px;padding:0 12px;border-radius:8px;color:#fff;text-decoration:none;white-space:nowrap;transition:background .18s ease;}
.sb-item:hover,.sb-item:focus-visible{background:rgba(255,255,255,.14);outline:none;}
.sb-item.sb-active{background:rgba(255,255,255,.24);}
.sb-ico{flex:0 0 24px;width:24px;height:24px;display:flex;align-items:center;justify-content:center;}
.sb-ico svg{width:24px;height:24px;display:block;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
.sb-txt{margin-left:16px;font-size:16px;line-height:1;opacity:0;transform:translateX(-6px);transition:opacity .18s ease,transform .18s ease;}
.sb-sidebar:hover .sb-txt,.sb-sidebar:focus-within .sb-txt{opacity:1;transform:translateX(0);}
.sb-sidebar:hover .sb-item .sb-txt{transition-delay:.06s;}
body{padding-left:var(--sb-w);}
@media (hover:none) and (min-width:721px){.sb-sidebar{width:var(--sb-w-open);}.sb-txt{opacity:1;transform:none;}}
@media (max-width:720px){:root{--sb-w:56px;--sb-w-open:56px;}.sb-txt{display:none;}.sb-sidebar:hover,.sb-sidebar:focus-within{width:var(--sb-w);}}
@media print{.sb-sidebar{display:none!important;}body{padding-left:0!important;}#thBtn,.th-dropdown{display:none!important;}}
</style>
</head>
<body class="theme-parchment">

<!-- ════════════ 侧边栏导航 ════════════ -->
<aside class="sb-sidebar" aria-label="主导航">
  <nav>
    <a class="sb-item" href="/" title="主页"><span class="sb-ico"><svg viewBox="0 0 24 24"><path d="M3.5 10.4 12 3.6l8.5 6.8"/><path d="M5.8 9.6V20h12.4V9.6"/><path d="M9.9 20v-5.2h4.2V20"/></svg></span><span class="sb-txt">主页</span></a>
    <a class="sb-item" href="/timeline.html" title="时间轴"><span class="sb-ico"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.4"/><path d="M12 7.2V12"/><path d="M12 12l3.6 2.4"/></svg></span><span class="sb-txt">时间轴</span></a>
    <a class="sb-item" href="/qa.html" title="问答练习"><span class="sb-ico"><svg viewBox="0 0 24 24"><path d="M9 18.2 4.2 20.4l1.1-4.3A6.9 6.9 0 1 1 9 18.2Z"/><path d="M12 8.2v1.3"/><path d="M12 12.4h.01"/></svg></span><span class="sb-txt">问答练习</span></a>
    <a class="sb-item" href="/quickref.html" title="速查"><span class="sb-ico"><svg viewBox="0 0 24 24"><circle cx="10.6" cy="10.6" r="6.4"/><path d="M15.4 15.4 20 20"/><path d="M8 10.6h5.2"/></svg></span><span class="sb-txt">速查</span></a>
    <a class="sb-item sb-active" href="/settings.html" title="设置"><span class="sb-ico"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06A1.7 1.7 0 0 0 15 19.4a1.7 1.7 0 0 0-1 1.55V21a2 2 0 1 1-4 0v-.09A1.7 1.7 0 0 0 9 19.4a1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-1.55-1H3a2 2 0 1 1 0-4h.09A1.7 1.7 0 0 0 4.6 9a1.7 1.7 0 0 0-.34-1.87l-.06-.06A2 2 0 1 1 7.03 4.24l.06.06A1.7 1.7 0 0 0 9 4.6a1.7 1.7 0 0 0 1-1.55V3a2 2 0 1 1 4 0v.09A1.7 1.7 0 0 0 15 4.6a1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.7 1.7 0 0 0 19.4 9c.26.58.84.93 1.51 1H21a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.51 1Z"/></svg></span><span class="sb-txt">设置</span></a>
  </nav>
</aside>
<script>
(function(){var p=(location.pathname.split("/").pop()||"index.html");document.querySelectorAll(".sb-item").forEach(function(a){var h=(a.getAttribute("href")||"").split("/").pop();if(h===p)a.classList.add("sb-active");else a.classList.remove("sb-active");});})();
</script>
<!-- ════════════ /侧边栏 ════════════ -->

<!-- 配色按钮 + 下拉（全局统一：切换后存于服务器 settings.json，所有页面保持一致） -->
<button id="thBtn">🎨 配色</button>
<div id="thBox" class="th-dropdown">
  <h4>配色方案（全局统一）</h4>
  <div class="th-grid">
    <div class="th-item active" data-t="parchment" onclick="pickTheme('parchment')"><span class="th-swatch" style="background:#f5efe0"></span>羊皮纸</div>
    <div class="th-item" data-t="ocean" onclick="pickTheme('ocean')"><span class="th-swatch" style="background:#ddeef7"></span>海洋蓝</div>
    <div class="th-item" data-t="forest" onclick="pickTheme('forest')"><span class="th-swatch" style="background:#e4f0e3"></span>自然绿</div>
    <div class="th-item" data-t="mono" onclick="pickTheme('mono')"><span class="th-swatch" style="background:#fff"></span>打印黑白</div>
  </div>
</div>

<div class="set-main">
  <h1>⚙️ 设置</h1>
  <div class="set-ver" id="verLine">版本加载中…</div>

  <!-- QQ 机器人凭证设置 -->
  <div class="set-card">
    <h2>🤖 QQ 机器人凭证</h2>
    <div class="set-status" id="botStatus"><span class="dot no"></span>状态读取中…</div>
    <div class="set-row" style="margin-top:14px;">
      <label for="appid">AppID</label>
      <input type="text" id="appid" placeholder="填写机器人 AppID">
    </div>
    <div class="set-row">
      <label for="secret">AppSecret</label>
      <input type="password" id="secret" placeholder="留空则不修改，填了才更新" autocomplete="off">
      <div class="set-tip">机器人未配置或需更换时在此填写；保存后自动重启机器人线程。</div>
    </div>
    <button class="set-btn" id="saveBtn">💾 保存设置</button>
    <div class="set-msg" id="setMsg"></div>
  </div>

  <div class="set-card">
    <h2>🎨 配色</h2>
    <p class="set-tip">配色为全局设置，四页共享。请用右上角的「🎨 配色」按钮切换；切换后自动保存到服务器 settings.json。</p>
  </div>
</div>

<script>
"use strict";
/* ════════════ 主题（全局统一：主题存于服务器 settings.json，与其它页面共享） ════════════ */
const THEME_ALT={"parchment":"theme-parchment","ocean":"theme-ocean","forest":"theme-forest","mono":"theme-mono"};
let G_THEME="parchment";
function applyThemeUI(){
  document.body.className=THEME_ALT[G_THEME]||"theme-parchment";
  document.querySelectorAll("#thBox .th-item").forEach(t=>t.classList.toggle("active",t.dataset.t===G_THEME));
}
function pickTheme(t){
  if(!THEME_ALT[t]) t="parchment";
  G_THEME=t; applyThemeUI();
  fetch("/api/ui/save",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({version:1,theme:t})}).catch(()=>{});
}
document.getElementById("thBtn").onclick=(e)=>{ e.stopPropagation(); document.getElementById("thBox").classList.toggle("open"); };
document.addEventListener("click",e=>{ const b=document.getElementById("thBox"); if(b&&!b.contains(e.target)&&e.target.id!=="thBtn")b.classList.remove("open"); });

/* ════════════ 设置页数据（均来自服务器，不写 localStorage） ════════════ */
const $=id=>document.getElementById(id);
function showMsg(text,ok){
  const m=$("setMsg");
  m.className="set-msg "+(ok?"ok":"err");
  m.textContent=text;
  if(ok) setTimeout(()=>{m.className="set-msg";},4000);
}
function loadSettings(){
  fetch("/api/settings/load").then(r=>r.json()).then(j=>{
    if(!(j&&j.ok&&j.data)) return;
    const d=j.data;
    // 版本号
    $("verLine").textContent="当前版本："+(d.appVersion||"v2.10");
    // 配色
    if(THEME_ALT[d.theme]){ G_THEME=d.theme; applyThemeUI(); }
    // 机器人凭证
    const qb=d.qqBot||{};
    $("appid").value=qb.appid||"";
    const st=$("botStatus");
    if(qb.hasSecret){
      st.innerHTML='<span class="dot ok"></span>机器人已配置 AppSecret，可直接访问。';
    }else{
      st.innerHTML='<span class="dot no"></span>未配置 AppSecret，机器人不会启动。';
    }
  }).catch(()=>{ $("verLine").textContent="当前版本：加载失败"; });
}
$("saveBtn").onclick=function(){
  const appid=$("appid").value.trim();
  const secret=$("secret").value;
  showMsg("正在保存…",true);
  fetch("/api/settings/save",{
    method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({theme:G_THEME, qqBot:{appid:appid, secret:secret}})
  }).then(r=>r.json()).then(j=>{
    if(j&&j.ok){
      showMsg("已保存，机器人已"+(j.botRestarted?"重启":"停止")+"。",true);
      $("secret").value="";
      loadSettings(); // 刷新状态（含 hasSecret）
    }else{
      showMsg("保存失败："+((j&&j.error)||"未知错误"),false);
    }
  }).catch(()=>showMsg("保存失败：网络错误",false));
};
loadSettings();
</script>

</body>
</html>
