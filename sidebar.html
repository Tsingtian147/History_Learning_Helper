<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>洛谷侧边栏 · 悬停展开</title>
<style>
  :root{
    --sb-bg:        #2b6cb0;              /* 侧栏底色（截图那个中蓝） */
    --sb-hover:     rgba(255,255,255,.14);/* 菜单项悬停底色 */
    --sb-fg:        #ffffff;              /* 图标 / 文字颜色 */
    --sb-line:      rgba(255,255,255,.30);/* 分隔线 */
    --sb-w:         64px;                 /* 收起宽度 */
    --sb-w-open:    220px;                /* 展开宽度 */
    --sb-item-h:    56px;                 /* 每个菜单项高度 */
    --sb-ease:      .26s cubic-bezier(.4,0,.2,1);
  }

  html, body{ height:100%; }
  body{
    margin:0;
    font-family:"Segoe UI","Lucida Grande",Helvetica,Arial,
                "Microsoft YaHei",FreeSans,Arimo,"Droid Sans",
                "wenquanyi micro hei","Hiragino Sans GB",sans-serif;
    background:#f5f6f8;
    color:#404040;
    padding-left:var(--sb-w);   /* 给侧栏让位，实际项目里按需删掉 */
  }

  /* ============ 侧栏容器 ============ */
  .lg-sidebar{
    position:fixed;
    top:0; left:0; bottom:0;
    width:var(--sb-w);
    background:var(--sb-bg);
    padding:16px 0;
    overflow:hidden;                 /* 收起时裁掉文字 */
    overflow-x:hidden;
    z-index:1000;
    transition:width var(--sb-ease);
    box-shadow:1px 0 0 rgba(0,0,0,.06);
    user-select:none;
    -webkit-tap-highlight-color:transparent;
  }
  /* 鼠标悬停整条侧栏 → 展开 */
  .lg-sidebar:hover,
  .lg-sidebar:focus-within{
    width:var(--sb-w-open);
  }

  /* ============ 菜单项 ============ */
  .lg-sidebar .item{
    display:flex;
    align-items:center;
    height:var(--sb-item-h);
    margin:2px 8px;
    padding:0 12px;
    border-radius:8px;
    color:var(--sb-fg);
    text-decoration:none;
    white-space:nowrap;
    transition:background .18s ease;
  }
  .lg-sidebar .item:hover,
  .lg-sidebar .item:focus-visible{
    background:var(--sb-hover);
    outline:none;
  }

  /* 图标：固定 24px，保证收起时正好居中 */
  .lg-sidebar .ico{
    flex:0 0 24px;
    width:24px; height:24px;
    display:flex; align-items:center; justify-content:center;
  }
  .lg-sidebar .ico svg{
    width:24px; height:24px;
    display:block;
    stroke:currentColor;
    fill:none;
    stroke-width:1.8;
    stroke-linecap:round;
    stroke-linejoin:round;
  }

  /* 文字：默认透明，展开后淡入 */
  .lg-sidebar .txt{
    margin-left:16px;
    font-size:16px;
    line-height:1;
    opacity:0;
    transform:translateX(-6px);
    transition:opacity .18s ease, transform .18s ease;
  }
  .lg-sidebar:hover .txt,
  .lg-sidebar:focus-within .txt{
    opacity:1;
    transform:translateX(0);
  }
  /* 展开动画期间文字稍晚一点出现，更自然 */
  .lg-sidebar:hover .item .txt{ transition-delay:.06s; }

  /* ============ 分隔线 ============ */
  .lg-sidebar .divider{
    height:1px;
    background:var(--sb-line);
    margin:12px 16px;
  }

  /* ============ 演示区（正式用时删掉） ============ */
  .demo{
    padding:40px 48px;
    font-size:14px;
    color:#7a7f87;
  }
  .demo h1{ font-size:20px; color:#2b6cb0; margin:0 0 8px; }

  /* 触摸设备没有 hover：用点击焦点展开 */
  @media (hover:none){
    .lg-sidebar{ width:var(--sb-w-open); }
    .lg-sidebar .txt{ opacity:1; transform:none; }
  }
</style>
</head>
<body>

<!-- ================= 侧边栏 ================= -->
<aside class="lg-sidebar" aria-label="主导航">
  <nav>

    <!-- 主页 -->
    <a class="item" href="/" title="主页">
      <span class="ico">
        <svg viewBox="0 0 24 24">
          <path d="M3.5 10.4 12 3.6l8.5 6.8"/>
          <path d="M5.8 9.6V20h12.4V9.6"/>
          <path d="M9.9 20v-5.2h4.2V20"/>
        </svg>
      </span>
      <span class="txt">主页</span>
    </a>

    <!-- 题库 -->
    <a class="item" href="/problem/list" title="题库">
      <span class="ico">
        <svg viewBox="0 0 24 24">
          <rect x="4.2" y="3.6" width="15.6" height="16.8" rx="2.2"/>
          <path d="M8.2 8.2h7.6M8.2 12h7.6M8.2 15.8h4.8"/>
        </svg>
      </span>
      <span class="txt">题库</span>
    </a>

    <!-- 网校 -->
    <a class="item" href="/training" title="网校">
      <span class="ico">
        <svg viewBox="0 0 24 24">
          <path d="M2.6 8.6 12 4.1l9.4 4.5L12 13.1 2.6 8.6Z"/>
          <path d="M6.2 10.9v3.9c0 1.4 2.6 2.5 5.8 2.5s5.8-1.1 5.8-2.5v-3.9"/>
          <path d="M21.4 8.6v4.9"/>
        </svg>
      </span>
      <span class="txt">网校</span>
    </a>

    <!-- 训练题单 -->
    <a class="item" href="/training" title="训练题单">
      <span class="ico">
        <svg viewBox="0 0 24 24">
          <path d="M9 4.6H7.6A1.6 1.6 0 0 0 6 6.2v13.2A1.6 1.6 0 0 0 7.6 21h8.8a1.6 1.6 0 0 0 1.6-1.6V6.2a1.6 1.6 0 0 0-1.6-1.6H15"/>
          <rect x="9" y="3" width="6" height="3.4" rx="1.1"/>
          <path d="M9.4 12.6l1.9 1.9 3.5-3.8"/>
        </svg>
      </span>
      <span class="txt">训练题单</span>
    </a>

    <!-- 比赛 -->
    <a class="item" href="/contest/list" title="比赛">
      <span class="ico">
        <svg viewBox="0 0 24 24">
          <path d="M4 20.2v-3.6"/>
          <path d="M9.3 20.2v-7.4"/>
          <path d="M14.7 20.2v-3.8"/>
          <path d="M20 20.2V6.6"/>
        </svg>
      </span>
      <span class="txt">比赛</span>
    </a>

    <!-- 评测记录 -->
    <a class="item" href="/record/list" title="评测记录">
      <span class="ico">
        <svg viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="8.4"/>
          <path d="M12 3.6V12"/>
          <path d="M12 12l7.3 4.2"/>
        </svg>
      </span>
      <span class="txt">评测记录</span>
    </a>

    <!-- 分隔线 -->
    <div class="divider" role="separator"></div>

    <!-- 讨论区 -->
    <a class="item" href="/discuss" title="讨论区">
      <span class="ico">
        <svg viewBox="0 0 24 24">
          <path d="M9 18.2 4.2 20.4l1.1-4.3A6.9 6.9 0 1 1 9 18.2Z"/>
          <path d="M15.4 8.1a5.3 5.3 0 1 1 3.1 4.8l-3.4 1.7.8-2.9"/>
        </svg>
      </span>
      <span class="txt">讨论区</span>
    </a>

    <!-- 文章广场 -->
    <a class="item" href="/article" title="文章广场">
      <span class="ico">
        <svg viewBox="0 0 24 24">
          <rect x="3.4" y="4.8" width="17.2" height="14.4" rx="2.2"/>
          <path d="M7 9h6M7 12.4h6M7 15.8h4"/>
          <rect x="15.2" y="9" width="2.6" height="6.8" rx=".6"/>
        </svg>
      </span>
      <span class="txt">文章广场</span>
    </a>

  </nav>
</aside>
<!-- ================= /侧边栏 ================= -->

<div class="demo">
  <h1>把鼠标移到左侧蓝色栏上试试</h1>
  <p>默认 64px 只显示图标，悬停展开到 220px 显示文字。</p>
</div>

</body>
</html>
